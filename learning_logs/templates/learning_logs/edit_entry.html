{% extends 'ecommerce_app/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4">
                    <a href="{% url 'learning_logs:topic' topic.id %}" class="text-decoration-none">{{ topic }}</a>
                </h2>
                <a href="{% url 'learning_logs:topic' topic.id %}" class="btn btn-outline-secondary">Back to Topic</a>
            </div>

            <h3 class="h5">Edit Entry:</h3>
            <form action="{% url 'learning_logs:edit_entry' entry.id %}" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
