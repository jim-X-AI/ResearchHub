{% extends 'ecommerce_app/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Topic</h2>
    <form action="{% url 'learning_logs:edit_topic' topic.id %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
    <a href="{% url 'learning_logs:topics' %}" class="btn btn-secondary mt-3">Back to Topics</a>
</div>
{% endblock content %}
