{% extends 'ecommerce_app/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">Register</h2>
                    <p class="text-center mb-4 text-muted">Create your account to get started</p>

                    <form action="{% url 'accounts:register' %}" method="post">
                        {% csrf_token %}
                        <div class="mb-4">
                            {{ form.as_p|safe }}  <!-- Ensure proper rendering of form fields -->
                        </div>
                        <button type="submit" class="btn btn-primary w-100 shadow-lg">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Card styling */
    .card {
        border-radius: 1rem;
        overflow: hidden;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .card-body {
        background-color: #f8f9fa; /* Light background for the card */
    }

    /* Button styling */
    .btn-primary {
        background-color: #007bff; /* Bootstrap primary color */
        border: none;
        transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #0056b3; /* Darker shade on hover */
    }

    /* Text styling */
    .card-title {
        font-weight: bold;
        color: #343a40; /* Dark text color */
    }

    .text-muted {
        color: #6c757d; /* Muted text color */
    }
</style>
{% endblock content %}
